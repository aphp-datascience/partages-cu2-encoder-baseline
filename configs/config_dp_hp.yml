# RAW condition with the hyper-parameters EXPOSED as placeholders, for an externally driven
# sweep (one job per point) rather than Optuna's in-process search — use config_dp_tune.yml
# for the latter.
#
# Identical to config_dp_raw.yml except that hidden size, dropout, warmup, the two learning
# rates and the head weight decay are substituted at launch time. Same guarantees: no
# synthetic data, validation on the held-out DEV split, never on PARHAF.
#
# TEMPLATE, not directly runnable: @DATA@ @BACKBONE@ @OUTPUT@ @MAXSTEP@ @HIDDEN@ @DROPOUT@
# @WARMUP@ @BERT_LR@ @HEAD_LR@ @HEAD_WD@ are substituted by the job launcher.
# See docs/training.md, "CU2 experiment configs".

vars:
  train_path: "@DATA@/train"
  val_path: "@DATA@/dev"
  label_attr: ["dp"]
  max_step: "@MAXSTEP@"
  validation_interval: 500

nlp:
  '@core': pipeline
  lang: eds
  components:
    doc_classifier:
      '@factory': eds.doc_classifier
      heads:
        dp:
          '@misc': eds.single_label_head
          labels: "@DATA@/valid_labels_dp.pkl"
          class_weights: "@DATA@/label_freq_dict_dp.pkl"
          loss: "ce"
          hidden_size: "@HIDDEN@"
          activation_mode: "gelu"
          dropout_rate: "@DROPOUT@"
          layer_norm: true
          loss_weight: 1.0
      embedding:
        '@factory': eds.doc_pooler
        pooling_mode: "attention"
        embedding:
          '@factory': eds.transformer
          model: "@BACKBONE@"
          window: 256

scorer:
  diag:
    '@metrics': eds.doc_classif
    label_attr: ${vars.label_attr}
  batch_size: "150 docs"
  speed: true

optimizer:
  "@core": optimizer !draft
  optim: torch.optim.AdamW
  total_steps: ${vars.max_step}
  groups:
  - selector: "doc_classifier[.]embedding[.]embedding"
    lr:
      "@schedules": linear
      warmup_rate: "@WARMUP@"
      start_value: 0
      max_value: "@BERT_LR@"
    weight_decay: 0.0
  - selector: ".*"
    lr:
      "@schedules": linear
      warmup_rate: 0.1
      start_value: 0
      max_value: "@HEAD_LR@"
    weight_decay: "@HEAD_WD@"
  module: ${ nlp }

train_data:
  data:
    '@readers': parquet
    path: ${vars.train_path}
    converter: omop
    doc_attributes: ${vars.label_attr}
  shuffle: fragment
  batch_size: "32 docs"
  sub_batch_size: "12000 words"
  pipe_names: "doc_classifier"

val_data:
  '@readers': parquet
  path: ${vars.val_path}
  converter: omop
  doc_attributes: ${vars.label_attr}

logger:
- json
- '@loggers': rich
  fields:
    step: {}
    "per_pipe/(.*)/results/loss":
      goal: lower_is_better
      format: "{:.2e}"
      goal_wait: 2
      name: "loss"
    "validation/(.*?)/dp/micro/f$":
      goal: higher_is_better
      format: "{:.2%}"
      goal_wait: 1
      name: "dp_mi_f"

train:
  nlp: ${nlp}
  train_data:
    - ${ train_data }
  val_data: ${val_data}
  scorer: ${scorer}
  optimizer: ${optimizer}
  loss_scales:
    doc_classifier: 1.
  max_steps: ${vars.max_step}
  validation_interval: ${vars.validation_interval}
  grad_max_norm: 1.0
  output_dir: "@OUTPUT@"
  mixed_precision: "bf16"
  num_workers: 8
  logger: ${logger}
  cpu: False
