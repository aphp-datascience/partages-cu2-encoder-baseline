# `clean` condition + SYNONYM REFERENTIAL, with the auxiliary loss scale SWEPT: the `clean`
# arm of the noise experiment, plus a `doc_classifier_syn` head fed by the synonym referential.
#
# The question it answers: is a referential that has been filtered by the qualification model
# useful downstream, given that an unfiltered referential was not?
#
#   - the training corpus, the DEV split and model selection are those of `clean`: the only
#     thing that changes is the auxiliary head, so the pairing with existing `clean` runs is
#     exact, seed by seed;
#   - `doc_classifier_syn` SHARES the weights of `doc_classifier`
#     (`${ nlp.components.doc_classifier }`) and adds no parameters: what is being tested is
#     the DATA, not extra capacity;
#   - validation on DEV, never on PARHAF.
#
# /!\ `@LOSSSCALE@` is swept. NEVER keep the value that maximises PARHAF — that would be tuning
#     on the test set. Report the whole grid; a conclusion must hold across all of it.
#
# TEMPLATE, not directly runnable: @DATA@ @BACKBONE@ @OUTPUT@ @MAXSTEP@ @SYN@ @LOSSSCALE@ are
# substituted by the job launcher. See docs/training.md, "CU2 experiment configs".

vars:
  train_path: "@DATA@/train"
  val_path: "@DATA@/dev"
  label_attr: ["dp"]
  max_step: "@MAXSTEP@"
  validation_interval: 500

nlp:
  '@core': pipeline
  lang: eds
  components:
    doc_classifier:
      '@factory': eds.doc_classifier
      heads:
        dp:
          '@misc': eds.single_label_head
          labels: "@DATA@/valid_labels_dp.pkl"
          class_weights: "@DATA@/label_freq_dict_dp.pkl"
          loss: "ce"
          hidden_size: 1024
          activation_mode: "gelu"
          dropout_rate: 0.05
          layer_norm: true
          loss_weight: 1.0
      embedding:
        '@factory': eds.doc_pooler
        pooling_mode: "attention"
        embedding:
          '@factory': eds.transformer
          model: "@BACKBONE@"
          window: 256

    doc_classifier_syn: ${ nlp.components.doc_classifier }

scorer:
  diag:
    '@metrics': eds.doc_classif
    label_attr: ${vars.label_attr}
  batch_size: "150 docs"
  speed: true

optimizer:
  "@core": optimizer !draft
  optim: torch.optim.AdamW
  total_steps: ${vars.max_step}
  groups:
  - selector: "doc_classifier[.]embedding[.]embedding"
    lr:
      "@schedules": linear
      warmup_rate: 0.15
      start_value: 0
      max_value: 3e-05
    weight_decay: 0.0
  - selector: ".*"
    lr:
      "@schedules": linear
      warmup_rate: 0.1
      start_value: 0
      max_value: 0.0005
    weight_decay: 0.0
  module: ${ nlp }

train_data:
  data:
    '@readers': parquet
    path: ${vars.train_path}
    converter: omop
    doc_attributes: ${vars.label_attr}
  shuffle: fragment
  batch_size: "32 docs"
  sub_batch_size: "12000 words"
  pipe_names: "doc_classifier"

val_data:
  '@readers': parquet
  path: ${vars.val_path}
  converter: omop
  doc_attributes: ${vars.label_attr}

logger:
- json
- '@loggers': rich
  fields:
    step: {}
    "per_pipe/(.*)/results/loss":
      goal: lower_is_better
      format: "{:.2e}"
      goal_wait: 2
      name: "loss"
    "validation/(.*?)/dp/micro/f$":
      goal: higher_is_better
      format: "{:.2%}"
      goal_wait: 1
      name: "dp_mi_f"

syn_data:
  data:
    '@readers': parquet
    path: "@SYN@"
    converter: omop
    doc_attributes: ${vars.label_attr}
  shuffle: dataset
  batch_size: "128 docs"
  pipe_names: "doc_classifier_syn"

train:
  nlp: ${nlp}
  train_data:
    - ${ train_data }
    - ${ syn_data }
  val_data: ${val_data}
  scorer: ${scorer}
  optimizer: ${optimizer}
  loss_scales:
    doc_classifier: 1.
    doc_classifier_syn: @LOSSSCALE@
  max_steps: ${vars.max_step}
  validation_interval: ${vars.validation_interval}
  grad_max_norm: 1.0
  output_dir: "@OUTPUT@"
  mixed_precision: "bf16"
  num_workers: 8
  logger: ${logger}
  cpu: False
