<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 300" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- edges -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M168,150 L196,150"/>
    <path d="M316,150 L344,150"/>
    <path d="M464,150 L492,150"/>
    <path d="M612,150 L640,150"/>
    <path d="M770,150 C800,150 800,80 828,80"/>
    <path d="M770,150 C800,150 800,220 828,220"/>
    <path d="M998,80 C1030,80 1030,150 1058,150"/>
    <path d="M998,220 C1030,220 1030,150 1058,150"/>
    <path d="M1178,150 L1196,150"/>
  </g>


  <!-- data nodes (pill) -->
  <g font-size="13" text-anchor="middle">
    <rect x="12" y="112" width="156" height="76" rx="32" fill="#64748b" stroke="#475569"/>
    <text x="90" y="140" fill="#f8fafc" font-weight="600">Stay text</text>
    <text x="90" y="157" fill="#e2e8f0" font-size="11">CCAM acts + CRC</text>
    <text x="90" y="172" fill="#e2e8f0" font-size="11">+ CR-OP + CRH</text>

    <rect x="640" y="118" width="130" height="64" rx="32" fill="#64748b" stroke="#475569"/>
    <text x="705" y="145" fill="#f8fafc" font-weight="600">Stay</text>
    <text x="705" y="163" fill="#f8fafc" font-weight="600">embedding</text>

    <rect x="1196" y="112" width="134" height="76" rx="32" fill="#64748b" stroke="#475569"/>
    <text x="1263" y="140" fill="#f8fafc" font-weight="600">DP · DR</text>
    <text x="1263" y="157" fill="#f8fafc" font-weight="600">target code</text>
    <text x="1263" y="174" fill="#e2e8f0" font-size="11">+ top-k candidates</text>
  </g>

  <!-- processing nodes -->
  <g font-size="13" text-anchor="middle">
    <rect x="196" y="118" width="120" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="256" y="145" fill="#f8fafc" font-weight="600">Windows</text>
    <text x="256" y="163" fill="#cbd5e1" font-size="11">256 tokens</text>

    <rect x="344" y="118" width="120" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="404" y="145" fill="#f8fafc" font-weight="600">Encoder</text>
    <text x="404" y="163" fill="#cbd5e1" font-size="11">DoctoBERT</text>

    <rect x="492" y="118" width="120" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="552" y="145" fill="#f8fafc" font-weight="600">Pooler</text>
    <text x="552" y="163" fill="#cbd5e1" font-size="11">attention</text>

    <rect x="1058" y="118" width="120" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="1118" y="145" fill="#f8fafc" font-weight="600">PMSI rule</text>
    <text x="1118" y="163" fill="#cbd5e1" font-size="11">dr_rule.json</text>
  </g>

  <!-- heads -->
  <g font-size="13" text-anchor="middle">
    <rect x="828" y="48" width="170" height="64" rx="8" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="913" y="75" fill="#ffffff" font-weight="600">affection head</text>
    <text x="913" y="93" fill="#dbeafe" font-size="11">12 950 ICD-10 codes</text>

    <rect x="828" y="188" width="170" height="64" rx="8" fill="#0891b2" stroke="#0e7490"/>
    <text x="913" y="215" fill="#ffffff" font-weight="600">mdp head</text>
    <text x="913" y="233" fill="#cffafe" font-size="11">720 Z codes · Z769 default</text>
  </g>
</svg>
